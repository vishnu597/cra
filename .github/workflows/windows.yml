name: Windows

# The Windows port: Packages/CraCore building and passing its tests off Apple platforms (on
# Windows and, as a cheap second check, Linux), and the Windows app in Windows/ building.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-windows:
    name: CraCore on Windows
    runs-on: windows-2022
    steps:
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - uses: actions/checkout@v4

      - name: Build and test CraCore
        run: swift test --package-path Packages/CraCore

  core-linux:
    name: CraCore on Linux
    runs-on: ubuntu-24.04
    container: swift:6.1.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: Build and test CraCore
        run: swift test --package-path Packages/CraCore

  app-windows:
    name: Build Cra for Windows
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - uses: actions/checkout@v4

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: Windows/vendor/cef
          key: cef-windows64-${{ hashFiles('scripts/fetch-cef.sh') }}

      # The WinUI projections take about 12 minutes to compile from scratch.
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: Windows/.build
          key: swiftpm-windows-${{ hashFiles('Windows/Package.swift', 'Windows/scripts/fetch-deps.ps1') }}-${{ github.sha }}
          restore-keys: swiftpm-windows-${{ hashFiles('Windows/Package.swift', 'Windows/scripts/fetch-deps.ps1') }}-

      - name: Fetch CEF and the Swift/WinRT projections
        shell: pwsh
        timeout-minutes: 20
        run: Windows/scripts/fetch-deps.ps1

      - name: Resolve Swift packages
        timeout-minutes: 10
        run: swift package --package-path Windows resolve

      # The WinUI projections are large generated modules; build them on their own first so a
      # slow or hung compile shows which module it is.
      - name: Build the WinUI projections
        timeout-minutes: 30
        run: swift build --package-path Windows -c release --target WinUI -v

      - name: Build and assemble Cra
        shell: pwsh
        timeout-minutes: 30
        run: Windows/scripts/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Cra-windows-x64
          path: Windows/build/Cra
          retention-days: 7
